# Nginx Production Configuration for MATN Platform (150 - 700+ Students)
# Place at: /etc/nginx/sites-available/matn-platform

# Rate limiting zone for authentication endpoints
limit_req_zone $binary_remote_addr zone=matn_auth:10m rate=10r/s;

server {
    listen 80;
    server_name __MATN_DOMAIN__ www.__MATN_DOMAIN__;
    server_tokens off;

    # Allow Let's Encrypt ACME challenge for automatic certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __MATN_DOMAIN__ www.__MATN_DOMAIN__;
    server_tokens off;

    # Standard Let's Encrypt certificate paths (managed by certbot --nginx)
    ssl_certificate /etc/letsencrypt/live/__MATN_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MATN_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Allow chunked video & PDF uploads
    client_max_body_size 50M;
    client_body_timeout 120s;

    # Gzip compression for fast API & UI loading on mobile networks
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Never allow direct static serving of uploads/
    location ^~ /uploads/ {
        deny all;
        return 404;
    }

    # Internal location for zero-overhead video streaming via X-Accel-Redirect (USE_NGINX_ACCEL=true)
    # Automatically replaced during install-vps.sh or adjust manually to match your deployment path:
    location /_protected_videos/ {
        internal;
        alias __MATN_UPLOADS_VIDEOS_DIR__/;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Nginx-level rate limiting for authentication & OTP endpoints
    location /api/auth/ {
        limit_req zone=matn_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache static modular frontend & vendor assets (?v=...) to reduce Node.js load
    location ~* ^/(assets/|js/|vendor/|styles\.css$|manifest\.json$) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering on video streams for instant seeking
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
